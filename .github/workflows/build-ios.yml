name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Fix iOS file permissions
        run: chmod -R u+w ios/

      - name: Ensure Capacitor iOS is installed
        run: npm install @capacitor/ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift Packages
        working-directory: ./ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build iOS App
        working-directory: ./ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
        
      - name: Package App for Simulator
        working-directory: ./ios/App/build/Build/Products/Release-iphonesimulator
        run: zip -r ../../../../../App.app.zip App.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: App.app.zip
